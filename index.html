<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="./style.css">
    <link rel="shortcut icon" href="./img/sorvete_icon.png" type="image/png">
    <script type="module" src="./index.js" defer></script>
    <title>Gelateria Geométrica — Calculadora Pistache</title>
</head>

<body>

    <header class="cabecalho">
        <div class="logo">
            <img src="./img/pistache.png" alt="Logo Gelateria Geométrica">
        </div>
        <div class="txt-logo">
            <p>Gelateria<br>Geométrica</p>
        </div>
    </header>

    <main>

        <section class="ent-dados">

            <div class="btn">
                <button id="btn-limpar">Limpar</button>
                <button id="btn-calcular">Calcular</button>
            </div>

            <div class="div-dados">
                <label for="meta">Meta de Produção:</label>
                <select id="meta">
                    <option value="1000">1 tonelada</option>
                    <option value="5000" selected>5 toneladas</option>
                    <option value="12000">12 toneladas</option>
                </select>
            </div>

            <div class="div-dados">
                <label for="pote">Escolha o Tamanho do Pote:</label>
                <select id="pote">
                    <option value="400">400 g</option>
                    <option value="900" selected>900 g</option>
                    <option value="1700">1700 g</option>
                </select>
            </div>

            <div class="div-dados">
                <label for="raio">Raio do Pote (cm):</label>
                <input type="number" id="raio" placeholder="ex: 7.5" min="1" max="30" step="0.1">
            </div>

            <div class="div-dados">
                <label for="altura">Altura do Pote (cm):</label>
                <input type="number" id="altura" placeholder="ex: 12.0" min="1" max="50" step="0.1">
            </div>

        </section>

        <section class="saida-dados">
            <h2>Relatório de Produção</h2>
            <div id="resposta">
                <p>Selecione a meta, o pote, informe as dimensões e clique em "Calcular" para ver o relatório completo.</p>
            </div>
        </section>

    </main>

</body>
</html>
